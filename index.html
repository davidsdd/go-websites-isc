<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eff4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11241f" media="(prefers-color-scheme: dark)">
  <!-- 修改这里可以更改浏览器标签页上的标题。 -->
  <title>Internal Services Council</title>
  <!-- 提前读取本地字体；无需联网。 -->
  <link rel="preload" href="./fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/enclosure.svg" as="image">
  <!-- 首屏背景直接适配主题，样式加载期间也保持相同底色。 -->
  <style>
    html { color-scheme: light dark; background: #eff4f0; }
    @media (prefers-color-scheme: dark) { html { background: #11241f; } }
    html.startup-pending .page > * { opacity: 0 !important; }
    html.startup-fallback {
      --font-cormorant: Georgia, serif;
      --font-dm-sans: Arial, sans-serif;
      --font-grotesk: Arial, sans-serif;
      --font-mono: monospace;
    }
  </style>
  <!-- 字体和本地图标准备好后一起显示，避免默认字体切换及图标迟到。 -->
  <script>
    (() => {
      if (!document.fonts) return;
      const root = document.documentElement;
      root.classList.add("startup-pending");
      const reveal = () => root.classList.remove("startup-pending");
      // 文件缺失或加载异常时仍能显示内容，不会一直隐藏页面。
      const limit = setTimeout(() => {
        // 超时后保持回退字体，避免迟到的字体再次改变已显示的排版。
        root.classList.add("startup-fallback");
        reveal();
      }, 3000);
      window.addEventListener("DOMContentLoaded", () => {
        const fonts = Array.from(document.fonts, font => font.load());
        const images = Array.from(document.images, image =>
          typeof image.decode === "function" ? image.decode() : Promise.resolve()
        );
        Promise.allSettled([...fonts, ...images])
          .then(() => document.fonts.ready)
          .then(() => { clearTimeout(limit); reveal(); }, reveal);
      }, { once: true });
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/enclosure.svg" type="image/svg+xml">
</head>
<body>
  <main class="page">
    <div class="hero">
      <!-- 柔和圆环包覆心形，象征关怀与内在安心。 -->
      <img class="emblem" src="./assets/enclosure.svg" alt="" aria-hidden="true" width="120" height="120">

      <!-- 完整网站标题：直接修改下面的文字，保留标签即可。 -->
      <h1>
        <span class="title-line">Internal Services</span>
        <span class="title-line council">Council</span>
      </h1>

      <div class="resting-line" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
