<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <style>
    :root {
      color-scheme: light dark;
      --panel: #e0ebe3;
      --edge: #628373;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #213c32;
        --edge: #bdd9c8;
      }
    }
  </style>
  <!-- 柔和圆环保护心形，内部使用统一底色。 -->
  <circle cx="60" cy="60" r="47" fill="var(--panel)"/>
